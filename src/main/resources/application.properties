spring.application.name=tienda
#se define el puerto donde escucha el servidor web
server.port=80
#Se define el formato de fecha/hora del log del proyecto
logging.pattern.dateformat = hh:mm
#Se elimina el Banner de SPRING del inicio
spring.main.banner-mode=off
#Para desarrollo el cache se inactiva, para produccion se activa
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/techshop
spring.datasource.url=jdbc:mysql://techshop-jgrijalba40565-josue0694-dd99.d.aivencloud.com:10279/techshop
 
#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.
 
#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Esta información se utiliza para obtener acceso a su storage
firebase.bucket.name=tienda-ea12b.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=tienda-ea12b-firebase-adminsdk-fbsvc-999786a6ba.json